<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F4DA6">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pregnancy Nutrition — Umoyo360</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .preg-page { min-height:100vh; background:var(--bg-light); }
    .preg-body { padding:1rem; max-width:680px; margin:0 auto; }

    .preg-tab-bar { display:flex; overflow-x:auto; gap:0.375rem; padding:0.75rem; background:var(--bg-white); border-bottom:1px solid var(--border); scrollbar-width:none; }
    .preg-tab-bar::-webkit-scrollbar { display:none; }
    .preg-tab { flex:1; min-width:80px; padding:0.6rem 0.5rem; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:var(--bg-surface); text-align:center; cursor:pointer; transition:var(--transition); font-family:inherit; }
    .preg-tab:hover:not(.active) { border-color:var(--primary); }
    .preg-tab.active { background:var(--primary); border-color:var(--primary); color:#fff; }
    .preg-tab-label { display:block; font-size:0.8rem; font-weight:700; }
    .preg-tab-sub { display:block; font-size:0.68rem; opacity:0.75; margin-top:0.1rem; }

    .preg-intro { background:var(--bg-white); border-radius:var(--radius); padding:1.125rem; box-shadow:var(--shadow-card); border:1px solid var(--border); margin-bottom:1rem; font-size:0.9rem; color:var(--text-medium); line-height:1.7; }

    .preg-h2 { font-size:0.95rem; font-weight:700; color:var(--primary); margin:1.25rem 0 0.625rem; display:flex; align-items:center; gap:0.4rem; }
    .preg-avoid-h { color:var(--accent-red); }
    .preg-warn-h  { color:var(--accent-red); }

    .preg-nutrient { background:var(--bg-white); border-radius:var(--radius); padding:1.125rem; box-shadow:var(--shadow-card); border:1px solid var(--border); border-left:4px solid; margin-bottom:0.75rem; }
    .preg-nut-head { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:0.4rem; margin-bottom:0.4rem; }
    .preg-nut-name { font-size:0.95rem; font-weight:700; }
    .preg-nut-target { font-size:0.75rem; font-weight:700; color:var(--text-light); background:var(--bg-surface); padding:0.2rem 0.6rem; border-radius:20px; border:1px solid var(--border); }
    .preg-nut-why { font-size:0.83rem; color:var(--text-medium); margin-bottom:0.75rem; line-height:1.55; }
    .preg-food-list { display:flex; flex-direction:column; gap:0.3rem; }
    .preg-food-row { display:flex; align-items:baseline; gap:0.5rem; flex-wrap:wrap; }
    .preg-food-name { font-size:0.82rem; font-weight:600; color:var(--text-dark); display:flex; align-items:center; gap:0.25rem; }
    .preg-food-note { font-size:0.72rem; color:var(--text-light); }

    .preg-meal-plan { background:var(--bg-white); border-radius:var(--radius); box-shadow:var(--shadow-card); border:1px solid var(--border); overflow:hidden; margin-bottom:0.5rem; }
    .preg-meal-row-plan { display:flex; align-items:baseline; gap:0.75rem; padding:0.7rem 1.125rem; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
    .preg-meal-row-plan:last-child { border-bottom:none; }
    .preg-meal-slot { font-size:0.82rem; font-weight:700; color:var(--primary); min-width:120px; flex-shrink:0; }
    .preg-meal-food { font-size:0.85rem; color:var(--text-dark); flex:1; }

    .preg-avoid-card { background:rgba(220,38,38,0.04); border:1px solid rgba(220,38,38,0.2); border-radius:var(--radius); padding:1rem 1.125rem; margin-bottom:0.75rem; }
    .preg-avoid-card ul { display:flex; flex-direction:column; gap:0.4rem; }
    .preg-avoid-card li { font-size:0.85rem; color:var(--text-dark); padding-left:1rem; position:relative; line-height:1.5; }
    .preg-avoid-card li::before { content:"✕"; position:absolute; left:0; color:var(--accent-red); font-size:0.7rem; top:2px; }

    .preg-tip { background:rgba(15,77,166,0.05); border-left:3px solid var(--primary); border-radius:var(--radius-sm); padding:0.875rem 1rem; font-size:0.85rem; color:var(--text-dark); display:flex; align-items:flex-start; gap:0.4rem; line-height:1.6; margin-bottom:0.75rem; }

    .preg-warn-card { background:rgba(220,38,38,0.04); border:1.5px solid rgba(220,38,38,0.3); border-radius:var(--radius); padding:1rem 1.125rem; margin-bottom:2rem; }
    .preg-warn-card ul { display:flex; flex-direction:column; gap:0.4rem; }
    .preg-warn-card li { font-size:0.85rem; color:var(--text-dark); padding-left:1.25rem; position:relative; line-height:1.5; }
    .preg-warn-card li::before { content:"⚠"; position:absolute; left:0; font-size:0.75rem; top:1px; }

    .icon { display:inline-block; vertical-align:middle; }
    @media (min-width:768px) { .preg-body { padding:2rem; } }
  </style>
</head>
<body class="preg-page">

<header class="page-header">
  <a href="dashboard.html" class="btn-back-nav" id="back-btn"></a>
  <h1>Pregnancy &amp; Maternal Nutrition</h1>
</header>

<div class="preg-tab-bar" id="stage-tabs"></div>

<main class="preg-body">
  <div id="stage-content">
    <div class="loading-spinner"><div class="spinner"></div></div>
  </div>
</main>

<script type="module">
  import { initPregnancyNutritionPage } from "./js/pregnancy-nutrition.js";
  import { icon } from "./js/icons.js";
  document.getElementById("back-btn").innerHTML = icon("arrowLeft", 22);
  initPregnancyNutritionPage();
</script>
</body>
</html>
