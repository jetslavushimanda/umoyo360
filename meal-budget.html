<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F4DA6">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Meal Budget Planner — Umoyo360</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .mb-page { min-height:100vh; background:var(--bg-light); }
    .mb-body { padding:1rem; max-width:680px; margin:0 auto; }

    .mb-form-card { background:var(--bg-white); border-radius:var(--radius); padding:1.375rem; box-shadow:var(--shadow-card); border:1px solid var(--border); margin-bottom:1.25rem; }
    .mb-form-card h2 { font-size:0.97rem; font-weight:700; color:var(--primary); margin-bottom:1rem; display:flex; align-items:center; gap:0.4rem; }

    .mb-size-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:0.5rem; margin-top:0.4rem; }
    .mb-size-btn { padding:0.5rem; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-surface); font-size:0.85rem; font-weight:700; cursor:pointer; transition:var(--transition); font-family:inherit; text-align:center; }
    .mb-size-btn.active { border-color:var(--primary); background:rgba(15,77,166,0.08); color:var(--primary); }

    .mb-budget-input { width:100%; padding:0.75rem 1rem; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:1.1rem; font-weight:700; color:var(--primary); background:var(--bg-white); appearance:none; transition:var(--transition); }
    .mb-budget-input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(15,77,166,0.12); }
    .mb-budget-input::placeholder { color:var(--text-light); font-weight:400; font-size:0.9rem; }

    .mb-select { width:100%; padding:0.65rem 0.875rem; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:0.9rem; color:var(--text-dark); background:var(--bg-white); appearance:none; cursor:pointer; }
    .mb-select:focus { outline:none; border-color:var(--primary); }
    .mb-label { font-size:0.9rem; font-weight:600; color:var(--text-dark); display:block; margin-bottom:0.5rem; }

    .mb-tip-card { background:rgba(15,77,166,0.05); border-left:3px solid var(--primary); border-radius:var(--radius-sm); padding:0.875rem; font-size:0.83rem; color:var(--text-dark); display:flex; align-items:flex-start; gap:0.4rem; line-height:1.6; margin-bottom:0.75rem; }
    .mb-result-header { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; border-radius:var(--radius); padding:1.125rem; margin-bottom:0.875rem; }

    /* Duration toggle */
    .mb-dur-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin-bottom:1rem; }
    .mb-dur-btn { padding:0.6rem; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-surface); font-size:0.88rem; font-weight:700; cursor:pointer; transition:var(--transition); font-family:inherit; text-align:center; }
    .mb-dur-btn.active { border-color:var(--accent-green); background:rgba(13,153,84,0.08); color:var(--accent-green); }

    /* Budget summary card */
    .budget-summary-card { background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%); border-radius:var(--radius); padding:1.25rem; color:white; margin-bottom:1rem; }
    .budget-summary-card h3 { font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; opacity:0.7; margin-bottom:0.5rem; }
    .budget-summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-top:0.75rem; }
    .budget-summary-item { background:rgba(255,255,255,0.12); border-radius:10px; padding:0.625rem; }
    .budget-summary-label { font-size:0.7rem; opacity:0.7; margin-bottom:2px; }
    .budget-summary-value { font-size:1.05rem; font-weight:800; letter-spacing:-0.02em; }
    .condition-badge { display:inline-block; padding:0.2rem 0.65rem; border-radius:20px; font-size:0.75rem; font-weight:700; background:rgba(255,255,255,0.2); margin-top:0.5rem; }

    /* Shopping list card */
    .shopping-list-card { background:var(--bg-white); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; margin-bottom:0.75rem; }
    .shopping-list-header { background:var(--bg-surface); padding:0.75rem 1rem; font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-medium); border-bottom:1px solid var(--border); }
    .shopping-list-item { display:flex; justify-content:space-between; align-items:center; padding:0.625rem 1rem; border-bottom:1px solid var(--border); font-size:0.85rem; }
    .shopping-list-item:last-child { border-bottom:none; }
    .shopping-item-name { color:var(--text-dark); font-weight:500; }
    .shopping-item-price { color:var(--accent-green); font-weight:700; }
    .shopping-total-row { display:flex; justify-content:space-between; padding:0.625rem 1rem; background:var(--bg-surface); border-top:1.5px solid var(--border); font-weight:700; font-size:0.82rem; color:var(--text-medium); }

    /* Meal day cards */
    .meal-day-card { background:var(--bg-white); border-radius:var(--radius); border:1px solid var(--border); margin-bottom:0.625rem; overflow:hidden; }
    .meal-day-header { background:var(--primary); color:white; padding:0.6rem 1rem; font-size:0.82rem; font-weight:700; }
    .meal-row { display:flex; align-items:flex-start; padding:0.5rem 1rem; border-bottom:1px solid var(--border); gap:0.75rem; font-size:0.83rem; }
    .meal-row:last-child { border-bottom:none; }
    .meal-label { font-weight:700; color:var(--primary); min-width:76px; flex-shrink:0; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; padding-top:2px; }
    .meal-foods { color:var(--text-dark); line-height:1.5; }

    /* AI response styles */
    .ai-response-wrapper { display:flex; flex-direction:column; gap:0; }
    .ai-heading-1 { font-size:1.1rem; font-weight:800; color:var(--primary); margin:1rem 0 0.5rem; padding-bottom:0.4rem; border-bottom:2px solid var(--primary); letter-spacing:-0.02em; }
    .ai-heading-2 { font-size:1rem; font-weight:700; color:var(--primary); margin:0.875rem 0 0.4rem; display:flex; align-items:center; gap:0.4rem; }
    .ai-heading-2::before { content:""; display:inline-block; width:4px; height:16px; background:var(--primary); border-radius:2px; }
    .ai-heading-3 { font-size:0.78rem; font-weight:700; color:var(--text-medium); margin:0.75rem 0 0.35rem; text-transform:uppercase; letter-spacing:0.04em; }
    .ai-paragraph { font-size:0.88rem; color:var(--text-dark); line-height:1.7; margin:0.35rem 0; }
    .ai-list { margin:0.4rem 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:0.3rem; }
    .ai-list-item { font-size:0.85rem; color:var(--text-dark); line-height:1.5; padding:0.35rem 0.65rem; background:var(--bg-surface); border-radius:8px; border-left:3px solid var(--accent-green); display:flex; align-items:flex-start; gap:0.4rem; }
    .ai-list-item::before { content:"→"; color:var(--accent-green); font-weight:700; flex-shrink:0; font-size:0.8rem; margin-top:1px; }
    .ai-numbered-list { margin:0.4rem 0; padding:0; list-style:none; counter-reset:ai-counter; display:flex; flex-direction:column; gap:0.4rem; }
    .ai-numbered-item { font-size:0.85rem; color:var(--text-dark); line-height:1.55; padding:0.5rem 0.75rem; background:var(--bg-white); border:1px solid var(--border); border-radius:10px; counter-increment:ai-counter; display:flex; align-items:flex-start; gap:0.625rem; }
    .ai-numbered-item::before { content:counter(ai-counter); min-width:24px; height:24px; background:var(--primary); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; flex-shrink:0; }
    .ai-divider { border:none; border-top:1px solid var(--border); margin:0.75rem 0; }

    .icon { display:inline-block; vertical-align:middle; }
    @media (max-width:400px) { .mb-size-grid { grid-template-columns:repeat(2,1fr); } }
    @media (min-width:768px) { .mb-body { padding:2rem; } }
  </style>
</head>
<body class="mb-page">

<header class="page-header">
  <a href="dashboard.html" class="btn-back-nav" id="back-btn"></a>
  <h1>Meal Budget Planner</h1>
</header>

<main class="mb-body">

  <!-- FORM CARD -->
  <div class="mb-form-card">
    <h2 id="form-title"></h2>
    <p style="font-size:0.88rem;color:var(--text-medium);margin-bottom:1.25rem;line-height:1.65;">Enter your weekly food budget and family details. We'll build a shopping list from real 2026 Zambian market prices, then AI generates your personalised meal plan.</p>

    <form id="budget-form" novalidate>

      <!-- Budget number input -->
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="mb-label" for="budget-input">Enter weekly budget in Kwacha</label>
        <input type="number" id="budget-input" class="mb-budget-input" min="50" max="99999" placeholder="Enter your budget e.g. 500">
      </div>

      <!-- Family size -->
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="mb-label">Family Size</label>
        <div class="mb-size-grid" id="size-grid">
          <button type="button" class="mb-size-btn" data-size="1">1</button>
          <button type="button" class="mb-size-btn active" data-size="4">4</button>
          <button type="button" class="mb-size-btn" data-size="6">6</button>
          <button type="button" class="mb-size-btn" data-size="8">8</button>
        </div>
        <input type="hidden" id="family-size" value="4">
      </div>

      <!-- Province -->
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="mb-label" for="province-select">Province</label>
        <select id="province-select" class="mb-select">
          <option value="Lusaka">Lusaka</option>
          <option value="Copperbelt">Copperbelt</option>
          <option value="Central">Central</option>
          <option value="Eastern">Eastern</option>
          <option value="Northern">Northern</option>
          <option value="Luapula">Luapula</option>
          <option value="North-Western">North-Western</option>
          <option value="Western">Western</option>
          <option value="Southern">Southern</option>
          <option value="Muchinga">Muchinga</option>
        </select>
      </div>

      <!-- Health condition -->
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="mb-label" for="condition-select">Health Condition</label>
        <select id="condition-select" class="mb-select">
          <option value="general">No specific condition</option>
          <option value="diabetes_type2">Diabetes (Type 2)</option>
          <option value="hypertension">Hypertension</option>
          <option value="heart_disease">Heart Disease</option>
          <option value="kidney_disease">Kidney Disease</option>
          <option value="obesity">Obesity</option>
          <option value="gout">Gout</option>
          <option value="anemia">Anaemia</option>
          <option value="thyroid">Thyroid Condition</option>
          <option value="celiac">Coeliac Disease</option>
          <option value="cholesterol">High Cholesterol</option>
          <option value="pregnancy">Pregnancy</option>
          <option value="malnutrition">Malnutrition</option>
        </select>
      </div>

      <button type="submit" class="btn-green btn-full" id="btn-generate" style="margin-top:0.25rem;"></button>
    </form>
  </div>

  <!-- PHASE 1 RESULT: Shopping List -->
  <div id="plan-result" class="hidden"></div>

  <!-- PHASE 2: AI Meal Plan section -->
  <div id="phase2-section" class="hidden">
    <div class="mb-form-card">
      <h2>Generate Your Meal Plan</h2>
      <p style="font-size:0.88rem;color:var(--text-medium);margin-bottom:1rem;line-height:1.65;">Generate a personalised meal plan using exactly what you just budgeted for.</p>
      <div class="mb-dur-grid">
        <button type="button" class="mb-dur-btn active" id="dur-weekly">📅 Weekly — 7 Days</button>
        <button type="button" class="mb-dur-btn" id="dur-monthly">🗓 Monthly — 30 Days</button>
      </div>
      <button class="btn-green btn-full" id="btn-generate-meals">Generate My Meal Plan</button>
    </div>
  </div>

  <!-- PHASE 2 RESULT: Meal Plan -->
  <div id="meal-plan-result" class="hidden"></div>

</main>

<script type="module">
  import { icon } from "./js/icons.js";
  import { requireAuth, loadUserProfile } from "./js/utils.js";

  // ── Icons ────────────────────────────────────────────────────────────────
  document.getElementById("back-btn").innerHTML = icon("arrowLeft", 22);
  document.getElementById("form-title").innerHTML = icon("budget", 18) + " Plan Your Meals";
  document.getElementById("btn-generate").innerHTML = icon("mealPlanner", 16) + " Calculate My Shopping List";

  // ── App state ────────────────────────────────────────────────────────────
  let userProfile = { fullName: "User", condition: "general" };
  let currentShoppingList = null;
  let currentDays = [];
  let currentFallbackText = "";
  let selectedDuration = 7;

  // ── Load Firebase profile ────────────────────────────────────────────────
  (async () => {
    try {
      const user = await requireAuth();
      const profile = await loadUserProfile(user.uid);
      if (profile) {
        userProfile.fullName = profile.fullName || "User";
        if (profile.condition) {
          userProfile.condition = profile.condition;
          const condSelect = document.getElementById("condition-select");
          const normalized = profile.condition.toLowerCase().replace(/\s+/g, "_");
          const opt = [...condSelect.options].find(
            o => o.value === normalized || o.value === profile.condition
          );
          if (opt) condSelect.value = opt.value;
        }
      }
    } catch { /* silent */ }
  })();

  // ── Family size buttons (scoped to #size-grid) ───────────────────────────
  document.getElementById("size-grid").addEventListener("click", e => {
    const btn = e.target.closest(".mb-size-btn");
    if (!btn) return;
    document.querySelectorAll("#size-grid .mb-size-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("family-size").value = btn.dataset.size;
  });

  // ── Duration toggle ──────────────────────────────────────────────────────
  document.getElementById("dur-weekly").addEventListener("click", () => {
    document.getElementById("dur-weekly").classList.add("active");
    document.getElementById("dur-monthly").classList.remove("active");
    selectedDuration = 7;
  });
  document.getElementById("dur-monthly").addEventListener("click", () => {
    document.getElementById("dur-monthly").classList.add("active");
    document.getElementById("dur-weekly").classList.remove("active");
    selectedDuration = 30;

  // ── PDF button delegation ────────────────────────────────────────────────

    if (e.target.closest("#btn-download-shopping-pdf")) {

      const familySize = parseInt(document.getElementById("family-size").value, 10);
      const province = document.getElementById("province-select").value;
      const condition = document.getElementById("condition-select").value;

  // ── Markdown parser ──────────────────────────────────────────────────────
  function parseMarkdown(text) {
    if (!text) return "";
    let html = text
      .replace(/^### (.+)$/gm, '<h3 class="ai-heading-3">$1</h3>')
      .replace(/^## (.+)$/gm,  '<h2 class="ai-heading-2">$1</h2>')
      .replace(/^# (.+)$/gm,   '<h1 class="ai-heading-1">$1</h1>')
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.+?)\*/g,     "<em>$1</em>")
      .replace(/^[\*\-] (.+)$/gm,  '<li class="ai-list-item">$1</li>')
      .replace(/^\d+\. (.+)$/gm,   '<li class="ai-numbered-item">$1</li>')
      .replace(/^---+$/gm,         '<hr class="ai-divider">')
      .replace(/\n\n/g, '</p><p class="ai-paragraph">')
      .replace(/\n/g,   "<br>");
    html = html.replace(
      /(<li class="ai-list-item">[\s\S]*?<\/li>(\s*<li class="ai-list-item">[\s\S]*?<\/li>)*)/g,
      '<ul class="ai-list">$1</ul>'
    );
    html = html.replace(
      /(<li class="ai-numbered-item">[\s\S]*?<\/li>(\s*<li class="ai-numbered-item">[\s\S]*?<\/li>)*)/g,
      '<ol class="ai-numbered-list">$1</ol>'
    );
    return '<p class="ai-paragraph">' + html + "</p>";
  }

  // ── Shopping list logic ──────────────────────────────────────────────────
  function normalizeCondition(c) {
    if (!c || c === "general" || c === "none") return "";
    return c.toLowerCase().replace(/\s+/g, "_");
  }

  function generateShoppingList(budget, condition) {
    const cond = normalizeCondition(condition);
    const categories = {};
    let remainingBudget = budget;
    let totalSpent = 0;

    const catOrder = ["proteins","vegetables","staples","fruits","dairy","cooking"];

    for (const catKey of catOrder) {
      const items = ZAMBIAN_PRICES_2026[catKey];
      if (!items) continue;

      const allowed = items.filter(item => !item.forbidden.includes(cond));
      if (allowed.length === 0) continue;

      const sorted = [...allowed].sort((a, b) => a.price - b.price);
      const catBudget = budget * CATEGORY_ALLOCATIONS[catKey];

      if (sorted[0].price > remainingBudget) continue;

      const selected = [];
      let catSpent = 0;

      selected.push(sorted[0]);
      catSpent += sorted[0].price;

      for (let i = 1; i < sorted.length; i++) {
        if (catSpent + sorted[i].price <= catBudget && catSpent + sorted[i].price <= remainingBudget) {
          selected.push(sorted[i]);
          catSpent += sorted[i].price;
        }
      }

      categories[catKey] = { items: selected, subtotal: catSpent };
      totalSpent += catSpent;
      remainingBudget -= catSpent;
    }

    return { categories, totalSpent, change: budget - totalSpent };
  }

  // ── Parse meal plan text into day cards (kept for PDF fallback) ──────────
  function parseMealPlan(text) {
    const days = [];
    const blocks = text.split(/(?=\bDAY\s+\d+\b)/i);
    const mealOrder = ["BREAKFAST","MORNING SNACK","LUNCH","AFTERNOON SNACK","SUPPER","SNACK"];

    for (const block of blocks) {
      const dayMatch = block.match(/\bDAY\s+(\d+)\b/i);
      if (!dayMatch) continue;

      const meals = {};
      for (const line of block.split("\n")) {
        const m = line.match(/^(BREAKFAST|LUNCH|SUPPER|MORNING SNACK|AFTERNOON SNACK|SNACK)\s*:\s*(.+)/i);
        if (m) meals[m[1].toUpperCase()] = m[2].replace(/\*/g, "").trim();
      }

      if (Object.keys(meals).length > 0) {
        days.push({ label:`DAY ${dayMatch[1]}`, meals, mealOrder });
      }
    }
    return days;
  }

  function mealLabelShort(key) {
    return key.replace("MORNING SNACK","AM SNACK").replace("AFTERNOON SNACK","PM SNACK");
  }

  // ── Hardcoded meal plan generator ───────────────────────────────────────
  function generateHardcodedMealPlan(condition, duration) {
    const COND_ALIAS = { anemia: "anaemia" };
    const raw  = normalizeCondition(condition) || "general";
    const cond = COND_ALIAS[raw] || raw;
    const template = MEAL_TEMPLATES[cond] || MEAL_TEMPLATES.general;
    const days = [];
    for (let d = 1; d <= duration; d++) {
      const bi = (d - 1) % template.breakfast.length;
      const li = (d - 1) % template.lunch.length;
      const si = (d - 1) % template.supper.length;
      days.push({
        label: `DAY ${d}`,
        meals: {
          BREAKFAST: template.breakfast[bi],
          LUNCH:     template.lunch[li],
          SUPPER:    template.supper[si]
        },
        mealOrder: ["BREAKFAST","LUNCH","SUPPER"]
      });
    }
    return days;
  }

      margin: 18,
      contentW: doc.internal.pageSize.getWidth() - 36,
      today: new Date().toLocaleDateString("en-ZM", { year:"numeric", month:"long", day:"numeric" })

      }
      doc.setFontSize(9.5);
      doc.text(line, margin, 40 + i * 7);
    });

    doc.setFillColor(15, 46, 82);
    doc.rect(0, pageH - 14, pageW, 14, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(9);
    doc.setFont("helvetica","bold");
    doc.text("UMOYO360 2026", margin, pageH - 5);
    doc.setFont("helvetica","normal");
    doc.text("Built in Zambia", pageW - margin, pageH - 5, { align:"right" });

    doc.save(`Umoyo360_MealPlan_${new Date().toISOString().slice(0,10)}.pdf`);
  }
</script>
