<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F4DA6">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Meal Budget Planner — Umoyo360</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .mb-page { min-height:100vh; background:var(--bg-light); }
    .mb-body { padding:1rem; max-width:680px; margin:0 auto; }

    .mb-form-card { background:var(--bg-white); border-radius:var(--radius); padding:1.375rem; box-shadow:var(--shadow-card); border:1px solid var(--border); margin-bottom:1.25rem; }
    .mb-form-card h2 { font-size:0.97rem; font-weight:700; color:var(--primary); margin-bottom:1rem; display:flex; align-items:center; gap:0.4rem; }

    .mb-range-group { margin-bottom:1.25rem; }
    .mb-range-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:0.625rem; }
    .mb-range-header label { font-size:0.9rem; font-weight:600; color:var(--text-dark); }
    .mb-budget-display { font-size:1.75rem; font-weight:900; color:var(--primary); }
    .mb-range-labels { display:flex; justify-content:space-between; font-size:0.7rem; color:var(--text-light); margin-top:0.3rem; }
    input[type="range"] { width:100%; accent-color:var(--primary); height:6px; }

    .mb-size-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:0.5rem; margin-top:0.4rem; }
    .mb-size-btn { padding:0.5rem; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-surface); font-size:0.85rem; font-weight:700; cursor:pointer; transition:var(--transition); font-family:inherit; text-align:center; }
    .mb-size-btn.active { border-color:var(--primary); background:rgba(15,77,166,0.08); color:var(--primary); }

    .mb-result-header { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; border-radius:var(--radius); padding:1.125rem; margin-bottom:0.875rem; }
    .mb-budget-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:0.5rem; margin-bottom:0.75rem; }
    .mb-budget-item { text-align:center; }
    .mb-budget-num { display:block; font-size:1.4rem; font-weight:900; }
    .mb-budget-lbl { display:block; font-size:0.68rem; opacity:0.8; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; }
    .mb-nutrition-pills { display:flex; flex-wrap:wrap; gap:0.35rem; }
    .mb-nut-pill { padding:0.2rem 0.6rem; border-radius:20px; font-size:0.72rem; font-weight:700; }
    .mb-nut-yes { background:rgba(13,153,84,0.15); color:#0D9954; border:1px solid rgba(13,153,84,0.3); }
    .mb-nut-no  { background:rgba(220,38,38,0.1);  color:#DC2626; border:1px solid rgba(220,38,38,0.25); }

    .mb-meal-card { background:var(--bg-white); border-radius:var(--radius); padding:1rem 1.125rem; box-shadow:var(--shadow-card); border:1px solid var(--border); margin-bottom:0.625rem; }
    .mb-meal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:0.5rem; flex-wrap:wrap; gap:0.4rem; }
    .mb-meal-name { font-size:0.88rem; font-weight:600; color:var(--text-dark); }
    .mb-meal-cost { font-size:0.82rem; font-weight:700; color:var(--accent-green); background:rgba(13,153,84,0.08); padding:0.2rem 0.55rem; border-radius:20px; border:1px solid rgba(13,153,84,0.2); }
    .mb-food-list { display:flex; flex-wrap:wrap; gap:0.4rem; }
    .mb-food-chip { display:flex; align-items:center; gap:0.25rem; font-size:0.75rem; color:var(--text-medium); background:var(--bg-surface); padding:0.25rem 0.6rem; border-radius:20px; border:1px solid var(--border); }
    .mb-food-chip em { color:var(--text-light); font-style:normal; }

    .mb-tip-card { background:rgba(15,77,166,0.05); border-left:3px solid var(--primary); border-radius:var(--radius-sm); padding:0.875rem; font-size:0.83rem; color:var(--text-dark); display:flex; align-items:flex-start; gap:0.4rem; line-height:1.6; margin-bottom:0.75rem; }
    .mb-nutrition-note { font-size:0.82rem; color:var(--text-medium); padding:0.875rem 1rem; background:var(--bg-white); border-radius:var(--radius-sm); border:1px solid var(--border); margin-bottom:2rem; line-height:1.6; }

    .icon { display:inline-block; vertical-align:middle; }
    @media (max-width:400px) { .mb-budget-summary { grid-template-columns:repeat(2,1fr); } }
    @media (min-width:768px) { .mb-body { padding:2rem; } }
  </style>
</head>
<body class="mb-page">

<header class="page-header">
  <a href="dashboard.html" class="btn-back-nav" id="back-btn"></a>
  <h1>Meal Budget Planner</h1>
</header>

<main class="mb-body">
  <div class="mb-form-card">
    <h2 id="form-title"></h2>
    <p style="font-size:0.88rem;color:var(--text-medium);margin-bottom:1rem;line-height:1.65;">Enter your daily food budget and family size. The planner will suggest the most nutritious meals within your budget using approximate Zambian market prices (2024).</p>

    <form id="budget-form" novalidate>
      <div class="mb-range-group">
        <div class="mb-range-header">
          <label for="budget-range">Daily Food Budget</label>
          <span class="mb-budget-display" id="budget-display">K60</span>
        </div>
        <input type="range" id="budget-range" min="20" max="300" step="5" value="60">
        <div class="mb-range-labels"><span>K20</span><span>K60</span><span>K150</span><span>K300</span></div>
      </div>

      <div class="form-group">
        <label>Family Size</label>
        <div class="mb-size-grid">
          <button type="button" class="mb-size-btn" data-size="1">1</button>
          <button type="button" class="mb-size-btn active" data-size="4">4</button>
          <button type="button" class="mb-size-btn" data-size="6">6</button>
          <button type="button" class="mb-size-btn" data-size="8">8</button>
        </div>
        <input type="hidden" id="family-size" value="4">
      </div>

      <div class="form-group" style="margin-top:1rem;">
        <label style="font-size:0.9rem;font-weight:600;color:var(--text-dark);display:block;margin-bottom:0.5rem;">Province</label>
        <select id="province-select" style="width:100%;padding:0.65rem 0.875rem;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:0.9rem;color:var(--text-dark);background:var(--bg-white);appearance:none;cursor:pointer;">
          <option value="Lusaka">Lusaka</option>
          <option value="Copperbelt">Copperbelt</option>
          <option value="Central">Central</option>
          <option value="Eastern">Eastern</option>
          <option value="Northern">Northern</option>
          <option value="Luapula">Luapula</option>
          <option value="North-Western">North-Western</option>
          <option value="Western">Western</option>
          <option value="Southern">Southern</option>
          <option value="Muchinga">Muchinga</option>
        </select>
      </div>

      <div class="form-group" style="margin-top:1rem;">
        <label style="font-size:0.9rem;font-weight:600;color:var(--text-dark);display:block;margin-bottom:0.5rem;">Plan Duration</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
          <button type="button" class="mb-size-btn active" id="dur-weekly" data-duration="7 days" style="padding:0.6rem;">
            📅 Weekly (7 days)
          </button>
          <button type="button" class="mb-size-btn" id="dur-monthly" data-duration="30 days" style="padding:0.6rem;">
            🗓 Monthly (30 days)
          </button>
        </div>
        <input type="hidden" id="plan-duration" value="7 days">
      </div>

      <button type="submit" class="btn-green btn-full" id="btn-generate" style="margin-top:1.25rem;"></button>
    </form>
  </div>

  <div id="plan-result" class="hidden"></div>
</main>

<script type="module">
  import { initMealBudgetPage } from "./js/meal-budget.js";
  import { icon } from "./js/icons.js";
  document.getElementById("back-btn").innerHTML = icon("arrowLeft", 22);
  document.getElementById("form-title").innerHTML = icon("budget",18) + " Plan Your Meals";
  document.getElementById("btn-generate").innerHTML = icon("mealPlanner",16) + " Generate Meal Plan";

  // Family size buttons
  document.querySelectorAll(".mb-size-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mb-size-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("family-size").value = btn.dataset.size;
    });
  });

  initMealBudgetPage();

  // Duration toggle buttons
  document.getElementById("dur-weekly")?.addEventListener("click", () => {
    document.getElementById("dur-weekly").classList.add("active");
    document.getElementById("dur-monthly").classList.remove("active");
    document.getElementById("plan-duration").value = "7 days";
  });
  document.getElementById("dur-monthly")?.addEventListener("click", () => {
    document.getElementById("dur-monthly").classList.add("active");
    document.getElementById("dur-weekly").classList.remove("active");
    document.getElementById("plan-duration").value = "30 days";
  });
</script>

<!-- Groq AI meal plan generation — capture-phase intercept before existing submit handler -->
<script type="module">
  import { requireAuth, loadUserProfile } from "./js/utils.js";
  import { generateBudgetPlan } from "./js/groq.js";

  let groqCondition = "general";

  (async () => {
    try {
      const user = await requireAuth();
      const profile = await loadUserProfile(user.uid);
      if (profile?.condition) groqCondition = profile.condition;
    } catch { /* silent */ }
  })();

  // Capture listener on main so it fires before #budget-form's own submit listener
  document.querySelector(".mb-body").addEventListener("submit", async function(e) {
    e.preventDefault();
    e.stopPropagation(); // Prevent existing generatePlan() from running

    const budget = parseInt(document.getElementById("budget-range")?.value || "60", 10);
    const familySize = parseInt(document.getElementById("family-size")?.value || "4", 10);
    const province = document.getElementById("province-select")?.value || "Lusaka";
    const duration = document.getElementById("plan-duration")?.value || "7 days";

    const btn = document.getElementById("btn-generate");
    const originalHTML = btn?.innerHTML;
    if (btn) {
      btn.innerHTML = "🤖 Groq AI is creating your affordable meal plan...";
      btn.disabled = true;
    }

    const container = document.getElementById("plan-result");
    if (container) {
      container.innerHTML = `
        <div style="background:var(--bg-white);border-radius:var(--radius);padding:1.5rem;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow-card);">
          <div style="font-size:1.5rem;margin-bottom:0.5rem;">🤖</div>
          <p style="font-size:0.9rem;color:var(--text-medium);">Groq AI is building your personalised ${duration} meal plan for a family of ${familySize} in ${province} Province…</p>
        </div>`;
      container.classList.remove("hidden");
      container.scrollIntoView({ behavior: "smooth" });
    }

    try {
      const aiText = await generateBudgetPlan(budget, familySize, province, groqCondition, duration);

      const formatted = aiText
        .split(/\n{2,}/)
        .map(para => `<p style="margin-bottom:0.75rem;line-height:1.7;font-size:0.875rem;">${para.replace(/\n/g,"<br>")}</p>`)
        .join("");

      if (container) {
        container.innerHTML = `
          <div class="mb-result-header" style="margin-bottom:0.875rem;">
            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem;">
              <span style="font-size:1rem;">✨</span>
              <strong style="font-size:1rem;">AI Meal Plan — ${duration} for ${familySize} people</strong>
            </div>
            <div style="font-size:0.8rem;opacity:0.85;">Budget: K${budget} &nbsp;·&nbsp; Province: ${province} &nbsp;·&nbsp; Condition: ${groqCondition}</div>
          </div>
          <div class="mb-meal-card" style="padding:1.25rem;">
            ${formatted}
          </div>
          <div class="mb-tip-card" style="margin-top:0.75rem;">
            <span>💡</span>
            <div>Prices are based on 2026 Zambian market averages. Actual prices may vary by area, season, and market.</div>
          </div>
        `;
      }
    } catch (err) {
      if (container) {
        container.innerHTML = `
          <div style="background:rgba(220,38,38,0.06);border:1.5px solid rgba(220,38,38,0.25);border-radius:var(--radius);padding:1.25rem;text-align:center;">
            <p style="color:var(--accent-red);font-size:0.9rem;">Something went wrong. Please check your connection and try again.</p>
          </div>`;
      }
    } finally {
      if (btn) { btn.innerHTML = originalHTML; btn.disabled = false; }
    }
  }, true); // capture phase
</script>
</body>
</html>
