<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F4DA6"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Cook With What You Have — Umoyo360</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .cw-page { min-height:100vh; background:var(--bg-light); }
    .cw-layout { display:flex; flex-direction:column; max-width:1100px; margin:0 auto; }

    /* ── Intro ─────────────────────────────────────────────────────────── */
    .cw-intro { background:var(--bg-white); border-radius:var(--radius); padding:1.125rem; box-shadow:var(--shadow-card); border:1px solid var(--border); margin-bottom:1rem; }
    .cw-intro p { font-size:0.9rem; color:var(--text-medium); line-height:1.65; }

    /* ── Condiments ────────────────────────────────────────────────────── */
    .cw-condiments { background:rgba(15,77,166,0.04); border:1px solid var(--border); border-radius:var(--radius-sm); padding:0.75rem 1rem; margin-bottom:1rem; display:flex; flex-wrap:wrap; align-items:center; gap:0.5rem; }
    .cw-condiment-label { font-size:0.78rem; font-weight:600; color:var(--text-medium); margin-right:0.25rem; display:flex; align-items:center; gap:0.3rem; }
    .cw-condiment-chip { display:flex; align-items:center; gap:0.3rem; font-size:0.78rem; font-weight:500; color:var(--text-dark); cursor:pointer; padding:0.3rem 0.6rem; border-radius:20px; background:var(--bg-white); border:1px solid var(--border); transition:var(--transition); }
    .cw-condiment-chip:hover { border-color:var(--primary); }
    .cw-condiment-chip input { accent-color:var(--primary); }

    /* ── Category ──────────────────────────────────────────────────────── */
    .cw-category { background:var(--bg-white); border-radius:var(--radius); box-shadow:var(--shadow-card); border:1px solid var(--border); margin-bottom:0.75rem; overflow:hidden; }
    .cw-cat-header { width:100%; background:none; border:none; padding:0.875rem 1.125rem; display:flex; align-items:center; cursor:pointer; gap:0.5rem; transition:background 0.15s; }
    .cw-cat-header:hover { background:rgba(15,77,166,0.04); }
    .cw-cat-name { font-size:0.93rem; font-weight:700; color:var(--text-dark); flex:1; text-align:left; }
    .cw-cat-count { font-size:0.75rem; color:var(--accent-green); font-weight:600; }
    .cw-cat-arrow { color:var(--text-light); font-size:0.75rem; transition:transform 0.2s; }
    .cw-cat-body { padding:0.5rem 0.875rem 0.875rem; display:none; }
    .cw-cat-body.expanded { display:block; }

    .cw-ingredient-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:0.4rem; }
    .cw-ingredient-chip { display:flex; align-items:center; gap:0.5rem; padding:0.5rem 0.65rem; border:1.5px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; transition:var(--transition); font-size:0.82rem; color:var(--text-dark); background:var(--bg-white); }
    .cw-ingredient-chip:hover { border-color:var(--primary); background:rgba(15,77,166,0.04); }
    .cw-ingredient-chip:has(input:checked) { border-color:var(--primary); background:rgba(15,77,166,0.08); font-weight:600; color:var(--primary); }
    .cw-ingredient-chip input { accent-color:var(--primary); flex-shrink:0; }
    .cw-ing-emoji { font-size:1.2rem; flex-shrink:0; }
    .cw-ing-name { font-size:0.8rem; line-height:1.3; flex:1; }

    /* ── Results counter ───────────────────────────────────────────────── */
    .cw-results-bar { padding:0.875rem 1rem; background:var(--primary); color:#fff; font-size:0.88rem; font-weight:700; border-radius:var(--radius-sm); margin:1.25rem 0 0.875rem; box-shadow:0 2px 8px rgba(15,77,166,0.25); }

    /* ── Recipe cards ──────────────────────────────────────────────────── */
    .cw-recipe-card { background:var(--bg-white); border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow-card); margin-bottom:0.75rem; overflow:hidden; transition:var(--transition); }
    .cw-recipe-card:hover { box-shadow:var(--shadow-hover); }
    .cw-recipe-header { padding:1.125rem; cursor:pointer; }
    .cw-recipe-meta { display:flex; gap:0.75rem; flex-wrap:wrap; margin-bottom:0.45rem; }
    .cw-recipe-difficulty, .cw-recipe-time, .cw-recipe-servings { font-size:0.75rem; font-weight:700; }
    .cw-recipe-time, .cw-recipe-servings { color:var(--text-medium); }
    .cw-recipe-name { font-size:0.97rem; font-weight:700; color:var(--text-dark); margin-bottom:0.3rem; line-height:1.35; }
    .cw-recipe-desc { font-size:0.82rem; color:var(--text-medium); line-height:1.5; margin-bottom:0.625rem; }
    .cw-nutrition-pills { display:flex; flex-wrap:wrap; gap:0.35rem; margin-bottom:0.5rem; }
    .cw-nut-pill { padding:0.2rem 0.55rem; border-radius:20px; font-size:0.7rem; font-weight:700; }
    .cw-expand-hint { font-size:0.75rem; color:var(--text-light); font-weight:600; }

    .cw-recipe-body { padding:0 1.125rem 1.125rem; border-top:1px solid var(--border); margin-top:0.25rem; }
    .cw-recipe-body.hidden { display:none; }

    .cw-ingredients-section { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin:0.875rem 0; }
    .cw-ing-col h4 { font-size:0.8rem; font-weight:700; color:var(--primary); margin-bottom:0.4rem; }
    .cw-ing-col ul { display:flex; flex-direction:column; gap:0.25rem; }
    .cw-ing-col li { font-size:0.8rem; color:var(--text-dark); }
    .cw-ing-col li.have-it { color:var(--accent-green); font-weight:500; }
    .cw-ing-col li.dont-have { color:var(--text-light); }

    .cw-steps h4 { font-size:0.85rem; font-weight:700; color:var(--primary); margin-bottom:0.5rem; }
    .cw-steps ol { padding-left:1.25rem; display:flex; flex-direction:column; gap:0.4rem; }
    .cw-steps ol li { font-size:0.85rem; color:var(--text-dark); line-height:1.55; }

    .cw-tip-box { background:rgba(15,77,166,0.05); border-left:3px solid var(--primary); border-radius:var(--radius-sm); padding:0.75rem 0.875rem; font-size:0.83rem; color:var(--text-dark); display:flex; gap:0.4rem; align-items:flex-start; line-height:1.5; margin-top:0.875rem; }

    /* ── Empty ─────────────────────────────────────────────────────────── */
    .cw-empty { background:var(--bg-white); border-radius:var(--radius); padding:2.5rem 1.5rem; text-align:center; border:1px solid var(--border); box-shadow:var(--shadow-card); }
    .cw-empty-icon { font-size:3rem; margin-bottom:0.75rem; }
    .cw-empty p { font-size:0.9rem; color:var(--text-medium); }
    .cw-empty-sub { font-size:0.82rem; color:var(--text-light); margin-top:0.4rem; }

    /* ── Two-col desktop ───────────────────────────────────────────────── */
    @media (min-width:900px) {
      .cw-layout { flex-direction:row; align-items:flex-start; gap:1.5rem; padding:2rem; }
      .cw-left { width:360px; flex-shrink:0; position:sticky; top:80px; max-height:calc(100vh - 100px); overflow-y:auto; padding-right:0.5rem; }
      .cw-right { flex:1; min-width:0; }
      .cw-right .cw-results-bar { margin-top:0; }
      .cw-ingredient-grid { grid-template-columns:1fr; }
    }
    @media (max-width:899px) {
      .cw-left, .cw-right { padding:0.875rem; }
    }
    @media (min-width:500px) and (max-width:899px) {
      .cw-ingredient-grid { grid-template-columns:repeat(3,1fr); }
    }
    @media (max-width:480px) {
      .cw-ingredient-grid { grid-template-columns:1fr 1fr; }
      .cw-ingredients-section { grid-template-columns:1fr; }
    }
    .icon { display:inline-block; vertical-align:middle; }

    /* AI response styles */
    .ai-response-wrapper { display:flex; flex-direction:column; gap:0; }
    .ai-heading-1 { font-size:1.1rem; font-weight:800; color:var(--primary); margin:1rem 0 0.5rem; padding-bottom:0.4rem; border-bottom:2px solid var(--primary); letter-spacing:-0.02em; }
    .ai-heading-2 { font-size:1rem; font-weight:700; color:var(--primary); margin:0.875rem 0 0.4rem; display:flex; align-items:center; gap:0.4rem; }
    .ai-heading-2::before { content:""; display:inline-block; width:4px; height:16px; background:var(--primary); border-radius:2px; }
    .ai-heading-3 { font-size:0.78rem; font-weight:700; color:var(--text-medium); margin:0.75rem 0 0.35rem; text-transform:uppercase; letter-spacing:0.04em; }
    .ai-paragraph { font-size:0.88rem; color:var(--text-dark); line-height:1.7; margin:0.35rem 0; }
    .ai-list { margin:0.4rem 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:0.3rem; }
    .ai-list-item { font-size:0.85rem; color:var(--text-dark); line-height:1.5; padding:0.35rem 0.65rem; background:var(--bg-surface); border-radius:8px; border-left:3px solid var(--accent-green); display:flex; align-items:flex-start; gap:0.4rem; }
    .ai-list-item::before { content:"→"; color:var(--accent-green); font-weight:700; flex-shrink:0; font-size:0.8rem; margin-top:1px; }
    .ai-numbered-list { margin:0.4rem 0; padding:0; list-style:none; counter-reset:ai-counter; display:flex; flex-direction:column; gap:0.4rem; }
    .ai-numbered-item { font-size:0.85rem; color:var(--text-dark); line-height:1.55; padding:0.5rem 0.75rem; background:var(--bg-white); border:1px solid var(--border); border-radius:10px; counter-increment:ai-counter; display:flex; align-items:flex-start; gap:0.625rem; }
    .ai-numbered-item::before { content:counter(ai-counter); min-width:24px; height:24px; background:var(--primary); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; flex-shrink:0; }
    .ai-divider { border:none; border-top:1px solid var(--border); margin:0.75rem 0; }
  </style>
</head>
<body class="cw-page">

<header class="page-header">
  <a href="dashboard.html" class="btn-back-nav" id="back-btn"></a>
  <h1>Cook With What You Have</h1>
</header>

<div class="cw-layout">
  <div class="cw-left">
    <div id="ingredient-selector">
      <div class="loading-spinner"><div class="spinner"></div></div>
    </div>
  </div>
  <div class="cw-right">
    <div class="cw-results-bar" id="recipe-counter">Select ingredients to see matching recipes</div>

    <!-- Groq AI recipe button -->
    <div style="margin:0.75rem 0 0.875rem;">
      <button class="btn-primary btn-full" id="btn-ai-recipes" style="gap:0.5rem;background:linear-gradient(135deg,#4A6CF7,#7C3AED);border-color:transparent;">
        ✨ Generate AI Recipes with Groq
      </button>
    </div>

    <div id="recipe-results">
      <div class="cw-empty">
        <div class="cw-empty-icon">🍳</div>
        <p>Select ingredients above to see what you can cook.</p>
      </div>
    </div>

    <!-- PDF download button — shown after Groq generates recipes -->
    <div id="pdf-download-area" style="display:none;margin-top:1rem;text-align:center;padding-bottom:2rem;">
      <button class="btn-secondary" id="btn-download-pdf" style="gap:0.5rem;min-width:200px;">
        ⬇ Download Recipes as PDF
      </button>
    </div>
  </div>
</div>

<script type="module">
  import { initCookWithPage } from "./js/cook-with.js";
  import { icon } from "./js/icons.js";
  document.getElementById("back-btn").innerHTML = icon("arrowLeft", 22);
  initCookWithPage();
</script>

<!-- Groq AI recipe generation + jsPDF download -->
<script type="module">
  import { requireAuth, loadUserProfile } from "./js/utils.js";
  import { generateRecipes } from "./js/groq.js";

  function parseMarkdown(text) {
    if (!text) return "";
    let html = text
      .replace(/^### (.+)$/gm, '<h3 class="ai-heading-3">$1</h3>')
      .replace(/^## (.+)$/gm,  '<h2 class="ai-heading-2">$1</h2>')
      .replace(/^# (.+)$/gm,   '<h1 class="ai-heading-1">$1</h1>')
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.+?)\*/g,     "<em>$1</em>")
      .replace(/^[\*\-] (.+)$/gm,  '<li class="ai-list-item">$1</li>')
      .replace(/^\d+\. (.+)$/gm,   '<li class="ai-numbered-item">$1</li>')
      .replace(/^---+$/gm,         '<hr class="ai-divider">')
      .replace(/\n\n/g, '</p><p class="ai-paragraph">')
      .replace(/\n/g,   "<br>");
    html = html.replace(
      /(<li class="ai-list-item">[\s\S]*?<\/li>(\s*<li class="ai-list-item">[\s\S]*?<\/li>)*)/g,
      '<ul class="ai-list">$1</ul>'
    );
    html = html.replace(
      /(<li class="ai-numbered-item">[\s\S]*?<\/li>(\s*<li class="ai-numbered-item">[\s\S]*?<\/li>)*)/g,
      '<ol class="ai-numbered-list">$1</ol>'
    );
    return '<p class="ai-paragraph">' + html + "</p>";
  }

  let groqProfile = { condition: "general", familySize: 4, fullName: "User" };
  let lastAiText = "";
  let lastIngredients = [];

  (async () => {
    try {
      const user = await requireAuth();
      const profile = await loadUserProfile(user.uid);
      if (profile) {
        groqProfile.condition = profile.condition || "general";
        groqProfile.familySize = profile.familySize || 4;
        groqProfile.fullName = profile.fullName || "User";
      }
    } catch { /* silent */ }
  })();

  document.getElementById("btn-ai-recipes")?.addEventListener("click", async () => {
    // Collect selected ingredients from DOM
    const selected = [
      ...document.querySelectorAll(".cw-ingredient-cb:checked"),
      ...document.querySelectorAll(".cw-condiment-cb:checked"),
    ].map(cb => cb.value);

    if (selected.length === 0) {
      const counter = document.getElementById("recipe-counter");
      if (counter) {
        counter.textContent = "Please select at least one ingredient first.";
        counter.style.background = "var(--accent-red)";
        setTimeout(() => { counter.style.background = ""; }, 2500);
      }
      return;
    }

    lastIngredients = selected;

    const btn = document.getElementById("btn-ai-recipes");
    btn.innerHTML = "🤖 Groq AI is creating your recipes...";
    btn.disabled = true;

    const results = document.getElementById("recipe-results");
    if (results) {
      results.innerHTML = `
        <div class="cw-empty" style="padding:2rem;">
          <div class="cw-empty-icon">🤖</div>
          <p>Groq AI is generating 3 personalised recipes for your ingredients…</p>
          <p class="cw-empty-sub">This may take a few seconds.</p>
        </div>`;
    }

    document.getElementById("pdf-download-area").style.display = "none";

    try {
      const aiText = await generateRecipes(selected, groqProfile.condition, groqProfile.familySize);
      lastAiText = aiText;

      // Split into 3 recipe blocks by heading patterns
      const recipeBlocks = splitRecipes(aiText);

      if (results) {
        results.innerHTML = recipeBlocks.map((block, i) => `
          <div class="cw-recipe-card" style="margin-bottom:0.875rem;">
            <div class="cw-recipe-header" style="cursor:default;">
              <div class="cw-recipe-meta">
                <span class="cw-recipe-difficulty" style="color:#7C3AED;">✨ AI Recipe ${i + 1}</span>
              </div>
              <div class="ai-response-wrapper">${parseMarkdown(block.trim())}</div>
            </div>
          </div>
        `).join("");

        document.getElementById("pdf-download-area").style.display = "block";
      }

    } catch (err) {
      if (results) {
        results.innerHTML = `
          <div class="cw-empty">
            <div class="cw-empty-icon">⚠️</div>
            <p style="color:var(--accent-red);">Something went wrong. Please check your connection and try again.</p>
          </div>`;
      }
    } finally {
      btn.innerHTML = "✨ Generate AI Recipes with Groq";
      btn.disabled = false;
    }
  });

  // PDF download
  document.getElementById("btn-download-pdf")?.addEventListener("click", () => {
    if (!lastAiText) return;
    generatePDF(lastAiText, lastIngredients, groqProfile);
  });

  function splitRecipes(text) {
    // Try to split on "Recipe 1", "Recipe 2", numbered headings, or "## " headings
    const parts = text.split(/(?=(?:Recipe\s*[123]|##\s*Recipe|\n#{1,3}\s))/i).filter(s => s.trim().length > 30);
    if (parts.length >= 2) return parts.slice(0, 3);
    // Fallback: split into 3 roughly equal parts
    const lines = text.split("\n");
    const third = Math.ceil(lines.length / 3);
    return [
      lines.slice(0, third).join("\n"),
      lines.slice(third, third * 2).join("\n"),
      lines.slice(third * 2).join("\n"),
    ];
  }

  function generatePDF(aiText, ingredients, profile) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 18;
    const contentW = pageW - margin * 2;
    const today = new Date().toLocaleDateString("en-ZM", { year:"numeric", month:"long", day:"numeric" });

    // ── Cover page ──────────────────────────────────────────
    doc.setFillColor(15, 46, 82);
    doc.rect(0, 0, pageW, pageH, "F");

    doc.setTextColor(255, 255, 255);
    doc.setFontSize(32);
    doc.setFont("helvetica", "bold");
    doc.text("UMOYO360", pageW / 2, 55, { align: "center" });

    doc.setFontSize(14);
    doc.setFont("helvetica", "normal");
    doc.text("Your Zambian Kitchen Guide", pageW / 2, 67, { align: "center" });

    doc.setDrawColor(255, 255, 255);
    doc.setLineWidth(0.4);
    doc.line(margin + 20, 74, pageW - margin - 20, 74);

    doc.setFontSize(11);
    doc.setFont("helvetica", "bold");
    doc.text(`Generated for: ${profile.fullName}`, pageW / 2, 85, { align: "center" });
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.text(`Condition: ${profile.condition}`, pageW / 2, 93, { align: "center" });
    doc.text(`Date: ${today}`, pageW / 2, 101, { align: "center" });

    doc.setFontSize(9);
    doc.setTextColor(180, 200, 240);
    doc.text(`Ingredients used: ${ingredients.slice(0, 8).join(", ")}${ingredients.length > 8 ? " +" + (ingredients.length - 8) + " more" : ""}`, pageW / 2, 115, { align: "center", maxWidth: contentW });

    // ── Recipe pages ────────────────────────────────────────
    const recipeBlocks = splitRecipes(aiText);
    const recipeColors = [[74, 108, 247], [124, 58, 237], [8, 145, 178]];

    recipeBlocks.forEach((block, idx) => {
      doc.addPage();
      const [r, g, b] = recipeColors[idx] || [15, 77, 166];

      // Header bar
      doc.setFillColor(r, g, b);
      doc.rect(0, 0, pageW, 22, "F");
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(13);
      doc.setFont("helvetica", "bold");
      doc.text(`Recipe ${idx + 1} of ${recipeBlocks.length}`, margin, 14);

      // Content
      doc.setTextColor(20, 30, 55);
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      const lines = doc.splitTextToSize(block.trim(), contentW);
      let y = 32;
      lines.forEach(line => {
        if (y > pageH - 20) {
          doc.addPage();
          doc.setFillColor(r, g, b);
          doc.rect(0, 0, pageW, 8, "F");
          y = 16;
          doc.setTextColor(20, 30, 55);
          doc.setFontSize(10);
          doc.setFont("helvetica", "normal");
        }
        const isHeading = /^(#{1,3}|\d+\.|Recipe\s*\d)/i.test(line.trim());
        if (isHeading) {
          doc.setFont("helvetica", "bold");
          doc.setTextColor(r, g, b);
        } else {
          doc.setFont("helvetica", "normal");
          doc.setTextColor(20, 30, 55);
        }
        doc.text(line, margin, y);
        y += isHeading ? 6 : 5;
      });
    });

    // ── Disclaimer page ─────────────────────────────────────
    doc.addPage();
    doc.setFillColor(248, 250, 253);
    doc.rect(0, 0, pageW, pageH, "F");

    doc.setTextColor(15, 77, 166);
    doc.setFontSize(13);
    doc.setFont("helvetica", "bold");
    doc.text("Health Disclaimer", margin, 28);

    doc.setFontSize(9.5);
    doc.setFont("helvetica", "normal");
    doc.setTextColor(67, 83, 115);
    const disclaimer = [
      "These recipes were generated by Groq AI based on the ingredients you selected and your",
      "stated health condition. They are intended as general nutritional guidance only.",
      "",
      "Always consult a qualified health professional or registered dietitian for personalised",
      "medical nutrition advice, especially if you have a serious health condition.",
      "",
      "Prices and food availability may vary by region and season across Zambia.",
    ];
    disclaimer.forEach((line, i) => { doc.text(line, margin, 40 + i * 7); });

    // Footer
    doc.setFillColor(15, 46, 82);
    doc.rect(0, pageH - 20, pageW, 20, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(10);
    doc.setFont("helvetica", "bold");
    doc.text("UMOYO360", margin, pageH - 10);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.text("Built in Zambia", pageW - margin, pageH - 10, { align: "right" });

    const fileName = `Umoyo360_Recipes_${new Date().toISOString().slice(0,10)}.pdf`;
    doc.save(fileName);
  }
</script>
</body>
</html>
